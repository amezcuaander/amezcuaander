<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ander — Índice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #F2DBBD;
    --paper: #FDF9F4;
    --ink: #17140F;
    --ink-soft: #6B6459;
    --red: #90040F;
    --line: #E3D2B4;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--cream);
    color: var(--ink);
    font-family: 'Montserrat', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
  }

  .sheet{
    width: 100%;
    max-width: 640px;
    background: var(--paper);
    border: 1px solid var(--ink);
    position: relative;
    display: flex;
  }

  .rail{
    width: 56px;
    flex-shrink: 0;
    background: var(--red);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 28px 0;
  }

  .rail span{
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.12em;
    color: var(--paper);
    text-transform: uppercase;
  }

  .content{
    flex: 1;
    min-width: 0;
  }

  .field{
    padding: 44px 40px 26px;
    border-bottom: 1px solid var(--line);
  }

  .eyebrow{
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 16px;
  }

  h1{
    font-weight: 800;
    font-size: 34px;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: var(--ink);
    line-height: 1.05;
  }

  .role{
    font-weight: 400;
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 12px;
    letter-spacing: 0.01em;
  }

  nav{ padding: 6px 0; }

  .link-row{
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px 40px;
    text-decoration: none;
    color: var(--ink);
    border-bottom: 1px solid var(--line);
    transition: background 0.15s ease, gap 0.15s ease;
  }
  .link-row:last-child{ border-bottom: none; }

  .link-row:hover, .link-row:focus-visible{
    background: rgba(144,4,15,0.05);
    gap: 26px;
    outline: none;
  }

  .link-index{
    font-weight: 700;
    font-size: 12px;
    color: var(--red);
    width: 22px;
    flex-shrink: 0;
  }

  .link-title{
    flex: 1;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .link-arrow{
    font-weight: 400;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .foot{
    padding: 16px 40px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
  }

  .foot span{ color: var(--red); }

  @media (max-width: 480px){
    .rail{ width: 40px; }
    .rail span{ font-size: 16px; }
    .field{ padding: 32px 24px 20px; }
    h1{ font-size: 26px; }
    .link-row{ padding: 16px 24px; }
    .foot{ padding: 14px 24px; flex-direction: column; gap: 4px; }
  }
</style>
</head>
<body>

  <main class="sheet">
    <div class="rail"><span>Ander · Índice</span></div>

    <div class="content">
      <div class="field">
        <div class="eyebrow">Índice personal</div>
        <h1>Ander Amezcua</h1>
        <p class="role">Estudiante de Arquitectura — Sevilla</p>
      </div>

      <nav>
        <!-- Edita aquí: texto del enlace y href -->
        <a class="link-row" href="https://drive.google.com/" target="_blank" rel="noopener">
          <span class="link-index">01</span>
          <span class="link-title">Apuntes y documentos</span>
          <span class="link-arrow">↗</span>
        </a>

        <a class="link-row" href="#" target="_blank" rel="noopener">
          <span class="link-index">02</span>
          <span class="link-title">Portfolio de proyectos</span>
          <span class="link-arrow">↗</span>
        </a>

        <a class="link-row" href="#" target="_blank" rel="noopener">
          <span class="link-index">03</span>
          <span class="link-title">Trabajo de Fin de Grado</span>
          <span class="link-arrow">↗</span>
        </a>

        <a class="link-row" href="mailto:tu@correo.com">
          <span class="link-index">04</span>
          <span class="link-title">Contacto</span>
          <span class="link-arrow">↗</span>
        </a>
      </nav>

      <div class="foot">
        <div>Sevilla <span>·</span> 2026</div>
        <div id="fecha"></div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('fecha').textContent = new Date().toLocaleDateString('es-ES', { year:'numeric', month:'2-digit' });
  </script>

</body>
</html>
