<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ander Amezcua — Contacto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F2DBBD;
    --paper:#F8F4EE;
    --ink:#17140F;
    --ink-soft:#6B6459;
    --line:rgba(23,20,15,.18);
    --red:#90040F;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{min-height:100%}

  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Montserrat', Arial, sans-serif;
    min-height:100vh;
    padding:20px 16px 28px;
  }

  header{
    width:100%;
    max-width:900px;
    margin:0 auto 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    padding:6px 4px 12px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .logo{width:22px;height:22px}
  .logo path{fill:none;stroke:var(--red);stroke-width:70.85px}

  .brand span{
    font-weight:800;
    font-size:14px;
    letter-spacing:.02em;
    text-transform:uppercase;
  }

  .menu{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  .menu a{
    min-height:44px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    text-decoration:none;
    border:1px solid var(--ink-soft);
    padding:7px 14px;
    transition:all .15s ease;
  }
  .menu a:hover{border-color:var(--red);color:var(--red)}
  .menu a.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .menu a.primary:hover{background:var(--red);border-color:var(--red);color:var(--paper)}

  .page{
    width:min(100%, 980px);
    margin:0 auto;
    background:rgba(253,249,244,.35);
    border:1px solid rgba(23,20,15,.08);
    padding:clamp(28px, 4vw, 44px);
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;
  }

  h1{
    font-size:clamp(40px, 6vw, 58px);
    line-height:.98;
    letter-spacing:-.04em;
    margin-bottom:28px;
  }

  .back-link{
    display:inline-block;
    color:var(--ink-soft);
    font-size:15px;
    font-style:italic;
    font-weight:600;
    margin-bottom:42px;
  }

  .contact-grid{
    display:grid;
    grid-template-columns:minmax(220px, 280px) minmax(280px, 1fr);
    gap:clamp(28px, 6vw, 90px);
    align-items:center;
  }

  .portrait-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .portrait{
    width:min(100%, 250px);
    aspect-ratio:1/1;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 35%, rgba(255,255,255,.78), rgba(255,255,255,.2) 58%, transparent 59%),
      linear-gradient(180deg, rgba(255,255,255,.52), rgba(255,255,255,.14));
    border:1px solid rgba(23,20,15,.08);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .portrait img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:grayscale(100%);
  }

  .details h2{
    font-size:clamp(28px, 4.4vw, 44px);
    line-height:1.05;
    letter-spacing:-.03em;
    margin-bottom:28px;
    max-width:14ch;
  }

  .details p,
  .details a{
    display:block;
    font-size:clamp(18px, 2vw, 21px);
    line-height:1.45;
    color:var(--ink);
    text-decoration:none;
    margin-bottom:14px;
  }

  .details a.muted{
    color:var(--ink-soft);
    text-decoration:underline;
    text-underline-offset:4px;
  }

  .portfolio-link{
    display:inline-flex !important;
    align-items:center;
    gap:10px;
    margin-top:8px;
    font-weight:700;
  }

  .portfolio-link svg{
    width:18px;
    height:18px;
    flex:0 0 auto;
  }

  .footer-nav{
    margin-top:64px;
    padding-top:22px;
    border-top:1px solid var(--line);
    display:grid;
    grid-template-columns:repeat(3, minmax(0,1fr));
    gap:16px;
  }

  .footer-nav a{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--ink);
    text-decoration:none;
    font-size:17px;
    font-weight:600;
  }

  .footer-nav a span{
    text-decoration:underline;
    text-underline-offset:4px;
  }

  .footer-nav svg{
    width:22px;
    height:22px;
    color:var(--ink-soft);
    flex:0 0 auto;
  }

  @media (max-width: 760px){
    .contact-grid{
      grid-template-columns:1fr;
      align-items:start;
    }

    .portrait-wrap{
      justify-content:flex-start;
    }

    .details h2{max-width:none}

    .footer-nav{
      grid-template-columns:1fr;
      gap:14px;
    }
  }

  @media (max-width: 520px){
    body{padding:14px 10px 18px}

    .page{padding:22px 18px}

    .menu{width:100%}
    .menu a{flex:1 1 140px}

    .details p,
    .details a{font-size:17px}
  }
</style>
</head>
<body>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    <nav class="footer-nav" aria-label="Enlaces inferiores">
      <a href="index.html">

          <path d="M3 20 12 4l3.5 6 5.5 10-7-3-3 3-1.5-5.5z"/>
        </svg>

      </a>
      <a href="proyectos.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    </nav>
  </main>
</body>
</html>
