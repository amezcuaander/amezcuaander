<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ander Amezcua — Contacto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F2DBBD;
    --paper:#FBF7F1;
    --paper-2:#F7F1E8;
    --ink:#17140F;
    --ink-soft:#6B6459;
    --line:rgba(23,20,15,.12);
    --line-strong:rgba(23,20,15,.2);
    --red:#90040F;
    --shadow:0 18px 50px rgba(23,20,15,.12);
    --radius:24px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}

  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Montserrat',Arial,sans-serif;
    min-height:100vh;
    padding:40px 28px 64px;
  }

  header{
    width:100%;
    max-width:900px;
    margin:0 auto 42px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    padding:6px 4px 10px;
  }

  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:22px;height:22px}
  .logo path{fill:none;stroke:var(--red);stroke-width:70.85px}

  .brand span{
    font-weight:800;
    font-size:14px;
    letter-spacing:.02em;
    text-transform:uppercase;
  }

  .menu{display:flex;gap:8px;flex-wrap:wrap}

  .menu a{
    min-height:44px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    text-decoration:none;
    border:1px solid var(--ink-soft);
    padding:7px 14px;
    transition:all .15s ease;
    background:transparent;
  }
  .menu a:hover{border-color:var(--red);color:var(--red)}
  .menu a.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .menu a.primary:hover{background:var(--red);border-color:var(--red);color:var(--paper)}

  .page{
    width:min(100%, 1220px);
    margin:0 auto;
  }

  .card{
    width:min(100%, 760px);
    margin:0 auto;
    background:linear-gradient(180deg, rgba(251,247,241,.96), rgba(247,241,232,.92));
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:clamp(38px, 6vw, 62px);
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;
  }

  h1{
    font-size:clamp(36px, 5.2vw, 54px);
    line-height:1;
    letter-spacing:-.04em;
    margin-bottom:24px;
  }

  .back-link{
    display:inline-block;
    color:var(--ink-soft);
    font-size:15px;
    font-style:italic;
    font-weight:600;
    margin-bottom:46px;
    text-decoration:underline;
    text-underline-offset:4px;
  }

  .contact-grid{
    display:grid;
    grid-template-columns:minmax(220px, 250px) minmax(300px, 1fr);
    gap:clamp(38px, 7vw, 96px);
    align-items:center;
  }

  .portrait-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .portrait{
    width:min(100%, 225px);
    aspect-ratio:1/1;
    border-radius:50%;
    overflow:hidden;
    border:1px solid rgba(23,20,15,.08);
    background:#efe7db;
    box-shadow:0 10px 24px rgba(23,20,15,.08);
  }

  .portrait img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .details h2{
    font-size:clamp(26px, 3.5vw, 38px);
    line-height:1.08;
    letter-spacing:-.03em;
    margin-bottom:24px;
    max-width:15ch;
  }

  .detail-list{display:grid;gap:14px}

  .detail-list a,
  .detail-list p{
    display:block;
    font-size:clamp(17px, 2vw, 20px);
    line-height:1.45;
    color:var(--ink);
    text-decoration:none;
  }

  .detail-list a.muted{
    color:var(--ink-soft);
    text-decoration:underline;
    text-underline-offset:4px;
  }

  .portfolio-link{
    display:inline-flex !important;
    align-items:center;
    gap:10px;
    margin-top:10px;
    font-weight:700;
  }

  .portfolio-link svg{width:18px;height:18px;flex:0 0 auto}

  .footer-nav{
    margin-top:60px;
    padding-top:28px;
    border-top:1px solid var(--line-strong);
    display:grid;
    grid-template-columns:repeat(3, minmax(0,1fr));
    gap:16px;
  }

  .footer-nav a{
    display:flex;
    align-items:center;
    gap:10px;
    min-height:44px;
    color:var(--ink);
    text-decoration:none;
    font-size:16px;
    font-weight:600;
  }

  .footer-nav a span{
    text-decoration:underline;
    text-underline-offset:4px;
  }

  .footer-nav svg{
    width:20px;
    height:20px;
    flex:0 0 auto;
    color:var(--ink-soft);
  }

  .footer-nav .logo-mini{
    width:18px;
    height:18px;
    color:var(--red);
  }

  .footer-nav .logo-mini path{
    fill:none;
    stroke:currentColor;
    stroke-width:70.85px;
  }

  @media (max-width: 760px){
    body{padding:28px 18px 40px}
    .card{width:min(100%, 680px);padding:32px 24px}
    .contact-grid{grid-template-columns:1fr;align-items:start;gap:34px}
    .portrait-wrap{justify-content:flex-start}
    .details h2{max-width:none}
    .footer-nav{grid-template-columns:1fr;gap:12px}
  }

  @media (max-width: 520px){
    body{padding:22px 14px 28px}
    header{margin-bottom:28px}
    .menu{width:100%}
    .menu a{flex:1 1 140px}
    .card{padding:28px 22px;border-radius:20px}
    .portrait{width:min(100%, 210px)}
    .back-link{margin-bottom:36px}
  }
</style>
</head>
<body>

      <nav class="footer-nav" aria-label="Enlaces inferiores">
        <a href="index.html">
          <svg class="logo-mini" viewBox="0 0 3508 3508" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g transform="matrix(1.76433,0,0,1.76433,-1340.59,-1340.59)">
              <path d="M2681.1,2681.1L1753.94,826.772L826.772,2681.1L2681.1,1753.94"/>
            </g>
          </svg>
          <span>Ander Amezcua</span>
        </a>
        <a href="proyectos.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/>

        <a href="cv.html">

      </nav>
    </section>
  </main>
</body>
</html>
